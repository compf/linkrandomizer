<div class="app-shell">
  <mat-toolbar color="primary" class="app-toolbar">
    <mat-icon class="app-logo">link</mat-icon>
    <span class="app-title">Link Randomizer</span>
  </mat-toolbar>

  <main class="app-main">
    <mat-tab-group
      class="app-tabs"
      animationDuration="200ms"
      dynamicHeight
      mat-stretch-tabs="false">
      <mat-tab>
        <ng-template mat-tab-label>
          <mat-icon class="tab-icon">shuffle</mat-icon>
          Generate URLs
        </ng-template>
        <ng-template matTabContent>
          <div class="tab-panel">
            <app-url-generator></app-url-generator>
          </div>
        </ng-template>
      </mat-tab>

      <mat-tab [disabled]="!frontendService.isElectron">
        <ng-template mat-tab-label>
          <mat-icon class="tab-icon">travel_explore</mat-icon>
          Analyze Website
        </ng-template>
        <ng-template matTabContent>
          <div class="tab-panel">
            <app-website-analyzer></app-website-analyzer>
          </div>
        </ng-template>
      </mat-tab>

      <mat-tab>
        <ng-template mat-tab-label>
          <mat-icon class="tab-icon">lightbulb</mat-icon>
          Random Facts
        </ng-template>
        <ng-template matTabContent>
          <div class="tab-panel">
            <app-random-facts></app-random-facts>
          </div>
        </ng-template>
      </mat-tab>
    </mat-tab-group>
  </main>
</div>
