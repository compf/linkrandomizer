<div class="tab-content">
  <h3>Analyze Website for URL Generation</h3>
  <div class="input-section">
    <input type="url" [(ngModel)]="websiteUrl" placeholder="Enter website URL" class="url-input">
  
    <button (click)="analyzeWebsite()"  class="analyze-btn">

      {{ isAnalyzing ? 'Stop Analysis' : 'Analyze' }}
    </button>

    <div class="result-section">
      Obtained URLs: {{ numberOfUrls() }}
    </div>
</div>
